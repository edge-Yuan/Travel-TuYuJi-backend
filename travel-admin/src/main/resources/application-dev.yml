spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tour_management_system?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 137063011azy
    druid:
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 6000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 6000
      min-evictable-idle-time-millis: 300000
  web:
    resources:
      # 启用静态资源处理，但只处理特定路径
      add-mappings: true
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
      cache:
        period: 3600

#Mybatis-plus相关配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
        id-type: auto
        logic-delete-value: -1
        logic-not-delete-value: 0
        logic-delete-field: deleted
    banner: false

#原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: null
server:
  tomcat:
    uri-encoding: UTF-8
  servlet:
    context-path: /travel-admin
  port:
    8082

# 文件上传配置
file:
  upload:
    # 文件上传根路径 - 优先使用配置的路径，失败时自动降级
    base-path: ${UPLOAD_PATH:${java.io.tmpdir}/uploads}
    # 文件访问URL前缀
    url-prefix: ${FILE_URL_PREFIX:http://localhost:8082/travel-admin}
    # 头像上传配置
    avatar:
      path: /avatars
      max-size: 2097152  # 2MB
      allowed-types:
        - image/jpeg
        - image/png
        - image/gif
    # 资质证明上传配置
    qualification:
      path: /qualifications
      max-size: 10485760  # 10MB
      allowed-types:
        - application/pdf
        - image/jpeg
        - image/png
    # 产品图片上传配置
    product:
      path: /products
      max-size: 5242880  # 5MB
      allowed-types:
        - image/jpeg
        - image/png
        - image/gif
    # 文章图片上传配置
    article:
      path: /articles
      max-size: 5242880  # 5MB
      allowed-types:
        - image/jpeg
        - image/png
        - image/gif

# JWT相关配置
sky:
  jwt:
    # 管理端员工JWT配置
    admin-secret-key: adminSkyTravel123456
    admin-ttl: 7200000
    admin-token-name: Authorization
    # 用户端JWT配置
    user-secret-key: userSkyTravel123456
    user-ttl: 7200000
    user-token-name: Authorization
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-ms: ${DEEPSEEK_TIMEOUT_MS:9000}
    max-retries: ${DEEPSEEK_MAX_RETRIES:1}
    qps: ${DEEPSEEK_QPS:5}
    insecure-skip-tls-verify: ${DEEPSEEK_INSECURE_SKIP_TLS_VERIFY:false}
    proxy-url: ${DEEPSEEK_PROXY_URL:}
